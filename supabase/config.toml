# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config

project_id = "open-bsp-api"

[api]
schemas = ["public", "storage", "billing", "crm"]

# Auth. site_url is the frontend origin; it + the OAuth authorization path form
# the consent UI URL the native OAuth server redirects to. In prod, Site URL is
# set in the dashboard (Authentication > URL Configuration).
[auth]
site_url = "http://localhost:5173"

# Native OAuth 2.1 server (Supabase Auth as the authorization server) — lets
# MCP clients (Claude Code/Desktop, ChatGPT) authenticate against the `mcp`
# edge function via OAuth with dynamic client registration. The consent UI
# lives in open-bsp-ui at site_url + authorization_url_path. NOTE: CI deploys
# functions but not this config — enable the OAuth server in PROD via the
# dashboard (Authentication > OAuth Server) or a one-time `supabase config
# push`.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

# [crm] Email templates (P1-03): links go to the app's /auth/confirm page with
# a token hash instead of /auth/v1/verify, whose fragment tokens the UI's PKCE
# client rejects. CI does not deploy this config: paste the same templates in
# the dashboard (Authentication > Email Templates).
# https://supabase.com/docs/guides/local-development/customizing-email-templates
[auth.email.template.invite]
subject = "You've been invited"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your sign-in link"
content_path = "./supabase/templates/magic_link.html"

[functions.whatsapp-webhook]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/whatsapp-webhook/index.ts"

[functions.instagram-webhook]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/instagram-webhook/index.ts"

[functions.whatsapp-management]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/whatsapp-management/index.ts"

[functions.instagram-management]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/instagram-management/index.ts"

[functions.media-preprocessor]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/media-preprocessor/index.ts"

[functions.agent-client]
verify_jwt = false
import_map = "./functions/deno.json"
