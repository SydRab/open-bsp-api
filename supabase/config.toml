[functions.whatsapp-dispatcher]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/whatsapp-dispatcher/index.ts"

# Connector services deploy the generic webhook/dispatcher under their own
# slug (the dispatcher trigger routes by `/{service}-dispatcher`); the
# generic code derives the service from the slug.
[functions.whatsapp-web-webhook]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/generic-webhook/index.ts"

[functions.whatsapp-web-dispatcher]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/generic-dispatcher/index.ts"

[functions.whatsapp-web-management]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/whatsapp-web-management/index.ts"

[functions.instagram-dispatcher]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/instagram-dispatcher/index.ts"

[functions.mcp]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/mcp/index.ts"

[functions.storage-gc]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/storage-gc/index.ts"

[functions.slack-management]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/slack-management/index.ts"

[functions.slack-webhook]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/slack-webhook/index.ts"

[functions.slack-dispatcher]
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/slack-dispatcher/index.ts"

# [crm] Invitations with a crm role (P1-03). JWT required: the invitation is
# created as the caller so the database enforces who may invite whom.
[functions.crm-invitations]
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/crm-invitations/index.ts"

# P1-10: the super-admin console's one endpoint. Every request carries a
# user JWT (verify_jwt catches a missing/invalid one before the function
# even runs); the function itself checks crm.is_platform_admin() on that
# caller before using the service role for anything.
[functions.crm-admin]
verify_jwt = true
import_map = "./functions/deno.json"
entrypoint = "./functions/crm-admin/index.ts"
